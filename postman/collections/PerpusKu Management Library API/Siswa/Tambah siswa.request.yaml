$kind: http-request
description: ""
url: "{{baseUrl}}/siswa"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
body:
  type: json
  content: |-
    {
      "nama": "Budi Santoso",
      "nis": 12345,
      "kelas_id": 1
    }
settings: {}
examples: ./.resources/Tambah siswa.resources/examples
order: 2000
