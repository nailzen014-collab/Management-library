$kind: http-example
name: Data siswa berhasil diperbarui.
request:
  url: "{{baseUrl}}/siswa/:siswa_id"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: siswa_id
      value: "1"
      disabled: false
      description: (Required) ID siswa.
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: json
    content: |-
      {
        "nama": "Budi Santoso",
        "nis": 12345,
        "kelas_id": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Siswa berhasil ditambahkan.",
        "data": {
          "id": 1,
          "nama": "Budi Santoso",
          "nis": 12345,
          "kelas_id": 1,
          "created_at": "2026-10-26T08:00:00.000000Z",
          "updated_at": "2026-10-26T08:00:00.000000Z",
          "kelas": {
            "id": 1,
            "nama_kelas": "XI RPL 1",
            "tingkat": "XI",
            "created_at": "2026-10-26T08:00:00.000000Z",
            "updated_at": "2026-10-26T08:00:00.000000Z",
            "siswa_count": 32,
            "siswa": [
              {
                "value": "<Circular reference to #/components/schemas/Siswa detected>"
              },
              {
                "value": "<Circular reference to #/components/schemas/Siswa detected>"
              }
            ]
          }
        }
      }
order: 1000
