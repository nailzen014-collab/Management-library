$kind: http-example
name: Data dengan ID yang diminta tidak ditemukan.
request:
  url: "{{baseUrl}}/siswa/:siswa_id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: siswa_id
      value: "1"
      disabled: false
      description: (Required) ID siswa.
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Data tidak ditemukan."
      }
order: 3000
