$kind: http-example
name: Kelas berhasil diperbarui.
request:
  url: "{{baseUrl}}/kelas/:kelas_id"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: kelas_id
      value: "1"
      disabled: false
      description: (Required) ID kelas.
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: json
    content: |-
      {
        "nama_kelas": "XI RPL 1",
        "tingkat": "XI"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Kelas berhasil ditambahkan.",
        "data": {
          "id": 1,
          "nama_kelas": "XI RPL 1",
          "tingkat": "XI",
          "created_at": "2026-10-26T08:00:00.000000Z",
          "updated_at": "2026-10-26T08:00:00.000000Z",
          "siswa_count": 32,
