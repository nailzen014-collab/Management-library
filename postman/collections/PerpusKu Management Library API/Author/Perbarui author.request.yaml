$kind: http-request
description: ""
url: "{{baseUrl}}/author/:author_id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: author_id
    value: "1"
    disabled: false
    description: (Required) ID author.
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
body:
  type: json
  content: |-
    {
      "nama_author": "Eko Kurniawan"
    }
settings: {}
examples: ./.resources/Perbarui author.resources/examples
order: 4000
