$kind: http-request
description: Author tidak dapat dihapus jika masih memiliki buku terkait.
url: "{{baseUrl}}/author/:author_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: author_id
    value: "1"
    disabled: false
    description: (Required) ID author.
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
settings: {}
examples: ./.resources/Hapus author.resources/examples
order: 6000
