$kind: http-example
name: Logout berhasil.
request:
  url: "{{baseUrl}}/logout"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Logout berhasil."
      }
order: 1000
