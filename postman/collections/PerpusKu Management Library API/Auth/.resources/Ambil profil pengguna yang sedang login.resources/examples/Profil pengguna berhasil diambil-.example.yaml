$kind: http-example
name: Profil pengguna berhasil diambil.
request:
  url: "{{baseUrl}}/me"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": 1,
          "name": "API Tester",
          "email": "api.tester@example.com",
          "email_verified_at": "2026-10-26T08:00:00.000000Z",
          "created_at": "2026-10-26T08:00:00.000000Z",
          "updated_at": "2026-10-26T08:00:00.000000Z"
        }
      }
order: 1000
