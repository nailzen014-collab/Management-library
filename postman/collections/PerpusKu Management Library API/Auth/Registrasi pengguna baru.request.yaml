$kind: http-request
description: Membuat akun pengguna baru lalu langsung mengembalikan Bearer token agar dapat mengakses endpoint lain.
url: "{{baseUrl}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
body:
  type: json
  content: |-
    {
      "name": "API Tester",
      "email": "api.tester@example.com",
      "password": "password",
      "password_confirmation": "password"
    }
settings: {}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      if (body && body.data && body.data.token) {
        pm.collectionVariables.set('bearerToken', body.data.token);
        pm.environment.set('bearerToken', body.data.token);
        pm.test('Bearer token tersimpan', function () {
          pm.expect(body.data.token).to.be.a('string').and.not.empty;
        });
      }
    language: text/javascript
examples: ./.resources/Registrasi pengguna baru.resources/examples
order: 1000
