$kind: http-example
name: Buku berhasil diperbarui.
request:
  url: "{{baseUrl}}/buku/:buku_id"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: buku_id
      value: "1"
      disabled: false
      description: (Required) ID buku.
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: json
    content: |-
      {
        "judul": "Belajar OpenAPI 3.0",
        "stock": 8,
        "author_id": 1,
        "kategori_id": [
          1,
          2
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Buku berhasil diperbarui.",
        "data": {
          "id": 1,
          "judul": "Belajar OpenAPI 3.0",
          "stock": 8,
          "author_id": 1,
          "author": {
            "id": 1,
            "nama_author": "Eko Kurniawan",
            "created_at": "2026-10-26T08:00:00.000000Z",
            "updated_at": "2026-10-26T08:00:00.000000Z"
          },
          "kategoris": [
            {
              "id": 1,
              "nama_kategori": "Programming",
              "created_at": "2026-10-26T08:00:00.000000Z",
              "updated_at": "2026-10-26T08:00:00.000000Z"
            },
            {
              "id": 2,
              "nama_kategori": "Web Development",
              "created_at": "2026-10-26T08:00:00.000000Z",
              "updated_at": "2026-10-26T08:00:00.000000Z"
            }
          ],
          "created_at": "2026-10-26T08:00:00.000000Z",
          "updated_at": "2026-10-26T08:00:00.000000Z"
        }
      }
order: 1000
