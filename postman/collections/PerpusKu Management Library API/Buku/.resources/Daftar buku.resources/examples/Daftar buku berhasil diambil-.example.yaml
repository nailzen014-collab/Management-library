$kind: http-example
name: Daftar buku berhasil diambil.
request:
  url: "{{baseUrl}}/buku?search=OpenAPI&author_id=1&kategori_id=1&page=1&per_page=10"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    search: OpenAPI
    author_id: "1"
    kategori_id: "1"
    page: "1"
    per_page: "10"
  pathVariables:
    - key: scheme
      value: "{{scheme}}"
      description: Skema protokol yang digunakan. (This can only be one of http,https)
    - key: host
      value: "{{host}}"
      description: Host tempat aplikasi berjalan.
    - key: port
      value: "{{port}}"
      description: Port aplikasi Laravel.
  body:
    type: text
    content: ""
