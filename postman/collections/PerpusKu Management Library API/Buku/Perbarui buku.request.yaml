$kind: http-request
description: ""
url: "{{baseUrl}}/buku/:buku_id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: buku_id
    value: "1"
    disabled: false
    description: (Required) ID buku.
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
body:
  type: json
  content: |-
    {
      "judul": "Belajar OpenAPI 3.0",
      "stock": 8,
      "author_id": 1,
      "kategori_id": [
        1,
        2
      ]
    }
settings: {}
examples: ./.resources/Perbarui buku.resources/examples
order: 4000
