$kind: http-request
description: Kategori tidak dapat dihapus jika masih memiliki buku terkait.
url: "{{baseUrl}}/kategori/:kategori_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: kategori_id
    value: "1"
    disabled: false
    description: (Required) ID kategori.
  - key: scheme
    value: "{{scheme}}"
    description: Skema protokol yang digunakan. (This can only be one of http,https)
  - key: host
    value: "{{host}}"
    description: Host tempat aplikasi berjalan.
  - key: port
    value: "{{port}}"
    description: Port aplikasi Laravel.
settings: {}
examples: ./.resources/Hapus kategori.resources/examples
order: 6000
